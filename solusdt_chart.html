<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLUSDT — Candlestick &amp; Volume</title>

  <!-- TradingView Lightweight Charts: free, no API key -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    /* -----------------------------------------------------------
       Design tokens (validated palette, light + dark)
       Categorical slots used:
         --up:    green (series-4)   – bullish candle + up volume
         --down:  red   (series-6)   – bearish candle + down volume
       ----------------------------------------------------------- */
    :root {
      /* categorical, fixed-order slots (8 total) */
      --series-1: #2a78d6;   /* blue    — accent / current price */
      --series-2: #1baf7a;   /* aqua    */
      --series-3: #eda100;   /* yellow  */
      --series-4: #008300;   /* green   — UP   */
      --series-5: #4a3aa7;   /* violet  */
      --series-6: #e34948;   /* red     — DOWN */
      --series-7: #e87ba4;   /* magenta */
      --series-8: #eb6834;   /* orange  */

      /* chart chrome & ink (light mode) */
      --surface-1:      #fcfcfb;
      --page-plane:     #f9f9f7;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #898781;
      --gridline:       #e1e0d9;
      --baseline:       #c3c2b7;
      --border:         rgba(11, 11, 11, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --series-1: #3987e5;
        --series-2: #199e70;
        --series-3: #c98500;
        --series-4: #008300;
        --series-5: #9085e9;
        --series-6: #e66767;
        --series-7: #d55181;
        --series-8: #d95926;

        --surface-1:      #1a1a19;
        --page-plane:     #0d0d0d;
        --text-primary:   #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted:     #898781;
        --gridline:       #2c2c2a;
        --baseline:       #383835;
        --border:         rgba(255, 255, 255, 0.10);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-plane);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    .chart-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .title-block h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }

    .title-block .subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      margin: 0;
    }

    .price-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 6px;
    }

    .price-line .price {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .price-line .change {
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .price-line .change.up    { color: var(--series-4); background: rgba(0, 131, 0, 0.10); }
    .price-line .change.down  { color: var(--series-6); background: rgba(227, 73, 72, 0.10); }

    .intervals {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .intervals button {
      background: transparent;
      border: 0;
      color: var(--text-secondary);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }

    .intervals button:hover {
      background: var(--gridline);
      color: var(--text-primary);
    }

    .intervals button.active {
      background: var(--series-1);
      color: #ffffff;
    }

    figure.chart-card {
      margin: 0;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      height: 620px;
      display: flex;
      flex-direction: column;
    }

    #candles, #volume {
      width: 100%;
    }
    #candles { height: 75%; }
    #volume  { height: calc(25% - 8px); margin-top: 8px; }

    figcaption.chart-caption {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .status.error { color: var(--series-6); }

    .legend {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .legend .item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    .swatch.up   { background: var(--series-4); }
    .swatch.down { background: var(--series-6); }

    @media (max-width: 640px) {
      figure.chart-card { height: 540px; }
      .price-line .price { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="chart-header">
      <div class="title-block">
        <h1>SOLUSDT <span class="status" id="status">loading…</span></h1>
        <p class="subtitle">Solana / Tether US &middot; candlesticks with volume</p>
        <div class="price-line">
          <span class="price" id="lastPrice">—</span>
          <span class="change" id="priceChange">—</span>
        </div>
      </div>

      <div class="intervals" role="tablist" aria-label="Interval">
        <button data-interval="1m"  >1m</button>
        <button data-interval="5m"  >5m</button>
        <button data-interval="15m" >15m</button>
        <button data-interval="1h"  >1h</button>
        <button data-interval="4h"  >4h</button>
        <button data-interval="1d"  class="active">1d</button>
        <button data-interval="1w"  >1w</button>
      </div>
    </header>

    <div class="legend" aria-hidden="true">
      <span class="item"><span class="swatch up"></span>Bullish (close &gt; open)</span>
      <span class="item"><span class="swatch down"></span>Bearish (close &lt; open)</span>
    </div>

    <figure class="chart-card">
      <div id="candles"></div>
      <div id="volume"></div>
      <figcaption class="chart-caption">
        Source: Binance public klines endpoint. Last 500 candles. Times in UTC.
      </figcaption>
    </figure>
  </div>

  <script>
    /* ---------------------------------------------------------------
       SOLUSDT candlestick + volume chart
       - Up/Down colors are categorical slot 4 (green) and slot 6 (red).
       - Volume histogram colors follow the same encoding.
       - Crosshair sync between candle and volume charts.
       --------------------------------------------------------------- */

    const cssVar = (name) =>
      getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    const UP_COLOR    = cssVar('--series-4');
    const DOWN_COLOR  = cssVar('--series-6');
    const GRID_COLOR  = cssVar('--gridline');
    const TEXT_COLOR  = cssVar('--text-secondary');
    const BORDER_COL  = cssVar('--border');

    // ---- Chart 1: candles ---------------------------------------------
    const candleEl = document.getElementById('candles');
    const candleChart = LightweightCharts.createChart(candleEl, {
      layout: {
        background: { type: 'solid', color: cssVar('--surface-1') },
        textColor:   TEXT_COLOR,
        fontFamily:  'system-ui, -apple-system, "Segoe UI", sans-serif',
      },
      grid: {
        vertLines: { color: GRID_COLOR, style: 0 },
        horzLines: { color: GRID_COLOR, style: 0 },
      },
      rightPriceScale: { borderColor: BORDER_COL },
      timeScale: {
        borderColor: BORDER_COL,
        timeVisible: true,
        secondsVisible: false,
      },
      crosshair: { mode: 1 },
    });

    const candleSeries = candleChart.addCandlestickSeries({
      upColor:        UP_COLOR,
      downColor:      DOWN_COLOR,
      borderUpColor:   UP_COLOR,
      borderDownColor: DOWN_COLOR,
      wickUpColor:     UP_COLOR,
      wickDownColor:   DOWN_COLOR,
    });

    // ---- Chart 2: volume ----------------------------------------------
    const volumeEl = document.getElementById('volume');
    const volumeChart = LightweightCharts.createChart(volumeEl, {
      layout: {
        background: { type: 'solid', color: cssVar('--surface-1') },
        textColor:   TEXT_COLOR,
        fontFamily:  'system-ui, -apple-system, "Segoe UI", sans-serif',
      },
      grid: {
        vertLines: { color: GRID_COLOR, style: 0 },
        horzLines: { color: GRID_COLOR, style: 0 },
      },
      rightPriceScale: { borderColor: BORDER_COL },
      timeScale: {
        borderColor: BORDER_COL,
        timeVisible: true,
        secondsVisible: false,
      },
      crosshair: { mode: 1 },
    });

    const volumeSeries = volumeChart.addHistogramSeries({
      priceFormat: { type: 'volume' },
      priceScaleId: '',
    });

    volumeSeries.priceScale().applyOptions({
      scaleMargins: { top: 0.8, bottom: 0 },
    });
    candleSeries.priceScale().applyOptions({
      scaleMargins: { top: 0.05, bottom: 0.25 },
    });

    // ---- Sync time scale ---------------------------------------------
    let isSyncing = false;
    function syncRange(source, target) {
      if (isSyncing) return;
      isSyncing = true;
      target.timeScale().setVisibleLogicalRange(source.timeScale().getVisibleLogicalRange());
      isSyncing = false;
    }
    candleChart.timeScale().subscribeVisibleLogicalRangeChange((r) => syncRange(candleChart, volumeChart));
    volumeChart.timeScale().subscribeVisibleLogicalRangeChange((r) => syncRange(volumeChart, candleChart));

    // ---- Data fetch: Binance klines for SOLUSDT -----------------------
    const STATUS = document.getElementById('status');
    const LAST_PRICE_EL = document.getElementById('lastPrice');
    const CHANGE_EL     = document.getElementById('priceChange');

    let currentInterval = '1d';
    let allCandles = [];
    let allVolumes = [];

    async function loadKlines(interval) {
      STATUS.textContent = 'loading…';
      STATUS.classList.remove('error');

      const url = `https://api.binance.com/api/v3/klines?symbol=SOLUSDT&interval=${interval}&limit=500`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();

        const candles = raw.map((k) => ({
          time: Math.floor(k[0] / 1000),
          open:  parseFloat(k[1]),
          high:  parseFloat(k[2]),
          low:   parseFloat(k[3]),
          close: parseFloat(k[4]),
        }));

        const volumes = raw.map((k) => {
          const close = parseFloat(k[4]);
          const open  = parseFloat(k[1]);
          const bullish = close >= open;
          return {
            time: Math.floor(k[0] / 1000),
            value: parseFloat(k[5]),
            color: bullish ? UP_COLOR : DOWN_COLOR,
          };
        });

        allCandles = candles;
        allVolumes = volumes;

        candleSeries.setData(candles);
        volumeSeries.setData(volumes);

        const last  = candles[candles.length - 1].close;
        const first = candles[0].open;
        const diff  = last - first;
        const pct   = (diff / first) * 100;
        LAST_PRICE_EL.textContent = last.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        CHANGE_EL.textContent = `${diff >= 0 ? '+' : ''}${diff.toFixed(2)} (${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)`;
        CHANGE_EL.classList.toggle('up',   diff >= 0);
        CHANGE_EL.classList.toggle('down', diff <  0);

        STATUS.textContent = `live · ${candles.length} bars · ${interval}`;
        candleChart.timeScale().fitContent();
      } catch (err) {
        console.error(err);
        STATUS.textContent = 'error fetching klines (CORS or rate limit)';
        STATUS.classList.add('error');
        // fallback synthetic data for demo
        const fallback = synthesizeFallback();
        candleSeries.setData(fallback.candles);
        volumeSeries.setData(fallback.volumes);
      }
    }

    function synthesizeFallback() {
      const now = Math.floor(Date.now() / 1000);
      const candles = [];
      const volumes = [];
      let price = 180;
      for (let i = 499; i >= 0; i--) {
        const t = now - i * 86400;
        const drift   = (Math.random() - 0.48) * 4;
        const open    = price;
        const close   = open + drift;
        const high    = Math.max(open, close) + Math.random() * 2;
        const low     = Math.min(open, close) - Math.random() * 2;
        const vol     = 200000 + Math.random() * 600000;
        const bullish = close >= open;
        candles.push({ time: t, open, high, low, close });
        volumes.push({ time: t, value: vol, color: bullish ? UP_COLOR : DOWN_COLOR });
        price = close;
      }
      return { candles, volumes };
    }

    // ---- Interval buttons --------------------------------------------
    document.querySelectorAll('.intervals button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.intervals button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentInterval = btn.dataset.interval;
        loadKlines(currentInterval);
      });
    });

    // ---- Resize handling ---------------------------------------------
    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) {
        const { width, height } = entry.contentRect;
        candleChart.resize(width, candleEl.clientHeight);
        volumeChart.resize(width, volumeEl.clientHeight);
      }
    });
    ro.observe(candleEl);
    ro.observe(volumeEl);

    // ---- Initial load -------------------------------------------------
    loadKlines(currentInterval);
  </script>
</body>
</html>
